name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The portable projects hold every decision the product makes, so the fast leg runs on Linux
  # and is the one that gates a change.
  portable:
    name: build and test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Velocity.Portable.slnf excludes the WinUI head, whose XAML compiler is a Windows
      # executable. Everything else, including the Windows-targeted libraries, compiles here.
      - run: dotnet restore Velocity.Portable.slnf
      - run: dotnet build Velocity.Portable.slnf --configuration Release --no-restore
      - run: dotnet test Velocity.Portable.slnf --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: "**/TestResults/*.trx"

  # The Windows leg is the only one that can build the WinUI head and run the platform layer.
  windows:
    name: build and test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Velocity.sln
      - run: dotnet build Velocity.sln --configuration Release --no-restore
      - run: dotnet test Velocity.sln --configuration Release --no-build
      # Read-only commands, so the runner is described and the catalogue exercised without
      # anything being changed on it.
      - name: Describe the runner through the engine
        run: dotnet run --project src/Velocity.Cli --configuration Release --no-build -- info
      - name: List the catalogue and its compatibility on this machine
        run: dotnet run --project src/Velocity.Cli --configuration Release --no-build -- catalogue
      - name: Report whether frame time capture can run here
        run: dotnet run --project src/Velocity.Cli --configuration Release --no-build -- benchmark
